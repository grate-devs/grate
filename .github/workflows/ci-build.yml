# Reusable build phase. Scheduling and aggregate gates live in ci.yml.
name: CI · Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-code:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11 RC3 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
         global-json-file: global.json
         dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: |
       dotnet restore -r linux-x64 grate.slnx
    - name: Build
      run: dotnet build --no-restore --no-self-contained -r linux-x64 src/grate/grate.csproj -c release


  # After preflight, isolated suites run alongside Build on each supported OS.
  # Keep the existing check names and artifact names after splitting the tiers.
