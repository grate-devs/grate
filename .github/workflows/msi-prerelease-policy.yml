name: MSI prerelease policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Native same-core policy (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -MTA -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Authoring and deterministic identity contracts
        run: |
          ./installers/msi/Test-InstallerIdentity.Tests.ps1
          ./installers/msi/Test-InstallerAuthoring.Tests.ps1
      - name: Actual prerelease refusals and stable upgrade
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: ./installers/msi/Test-PrereleaseMsiPolicy.ps1 -Architecture $env:TEST_ARCH -OutputDirectory "$env:RUNNER_TEMP/msi-prerelease-policy"
      - name: Retain policy evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msi-prerelease-policy-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/msi-prerelease-policy/**/*.json
            ${{ runner.temp }}/msi-prerelease-policy/**/*.log
            ${{ runner.temp }}/msi-prerelease-policy/*.msi
          if-no-files-found: warn
          retention-days: 7
