# Called by build.yml; source checkout always uses the caller's immutable event SHA.
name: Release · docker slim build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: string
        required: true
      prerelease:
        type: string
        required: true

permissions:
  contents: read

jobs:
  main:
    name: Build and verify ${{ matrix.distribution }} Docker archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distribution: [SQLite, SQLServer, MariaDB, PostgreSQL, Oracle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the selected profile into a retained OCI archive
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: ./installers/docker/Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/grate-image.tar
          tags: gratedevs/grate:build-${{ matrix.distribution }}
          labels: |
            org.opencontainers.image.source=https://github.com/grate-devs/grate
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.flavor=${{ matrix.distribution }}
          build-args: |
            VERSION=${{ inputs.version }}
            GRATE_DISTRIBUTION=${{ matrix.distribution }}
      - name: Bind and preflight the profile archive before the release gate
        shell: pwsh
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISH: ${{ inputs.publish }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends skopeo
          $parameters = @{
            Distribution = $env:DISTRIBUTION
            Version = $env:VERSION
            SourceCommit = $env:SOURCE_COMMIT
            ExpectedDigest = $env:EXPECTED_DIGEST
            Archive = "$env:RUNNER_TEMP/grate-image.tar"
            Report = "$env:RUNNER_TEMP/slim-archive-validation.json"
            Mode = $(if ($env:PUBLISH -eq 'true') { 'Preflight' } else { 'Verify' })
            Prerelease = $env:PRERELEASE -eq 'true'
          }
          ./scripts/release/publish_slim_docker_archive.ps1 @parameters
      - name: Retain the profile archive and its verified identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: grate-docker-${{ matrix.distribution }}-oci-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/grate-image.tar
            ${{ runner.temp }}/slim-archive-validation.json
          if-no-files-found: error
