# Reusable security analysis phase. Scheduling and aggregate gates live in ci.yml.
name: CI · Security analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Code Security
    # PR/manual analysis keeps the staged gates; main/schedule refreshes its
    # baseline even though those build/test producers are intentionally skipped.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 11 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.3
      with:
        # Repository statistics can still list removed Python sources. Select
        # the remaining languages, including native MSI code and workflows.
        languages: csharp, c-cpp, actions

    # Autobuild can choose an example .sln instead of the maintained root .slnx.
    - name: Build .NET solution for CodeQL
      shell: pwsh
      run: dotnet build grate.slnx --configuration Release --no-incremental -p:UseSharedCompilation=false

    # Trace the Windows-only MSI action as well as the complete .NET solution.
    - name: Build native MSI upgrade action for CodeQL
      shell: pwsh
      run: ./installers/msi/native/Build-UpgradeActions.ps1 -Architecture x64 -OutputDirectory "$env:RUNNER_TEMP/codeql-msi-upgrade-actions"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.3
