# Called by build.yml; source checkout always uses the caller's immutable event SHA.
name: Release · cli

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: string
        required: true
      runner:
        type: string
        required: true
      runtime-identifiers:
        type: string
        required: true
      native-arm-sdk:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  main:
    name: Build cli

    runs-on: ${{ inputs.runner }}
    strategy:
      matrix:
        distribution: [All, SQLite, SQLServer, MariaDB, PostgreSQL, Oracle]
        arch: ${{ fromJSON(inputs.runtime-identifiers) }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Setup .NET 11 and .NET 10
      if: ${{ !inputs.native-arm-sdk }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; #830 redirect sanitization
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
    - name: Setup native macOS Arm64 SDK in isolated directories
      if: ${{ inputs.native-arm-sdk }}
      uses: ./.github/actions/setup-dotnet-macos-arm64
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Publish self-contained ${{ matrix.arch }}
      shell: pwsh
      run: ./scripts/verify-packages.ps1 -Kind Standalone -Distribution '${{ matrix.distribution }}' -RuntimeIdentifier '${{ matrix.arch }}' -StandaloneVersion '${{ inputs.version }}' -OutputDirectory './publish/${{ matrix.arch }}'
      env:
        VERSION: ${{ inputs.version }}
        TargetFramework: net11.0


    - name: Select distribution identity
      id: distribution
      shell: pwsh
      run: |
        . ./scripts/release/distribution_profiles.ps1
        $profile = Get-GrateDistribution -Name '${{ matrix.distribution }}'
        "package-id=$($profile.PackageId)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
    - name: Upload self-contained ${{ matrix.arch }}
      #if: ${{ inputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.distribution.outputs.package-id }}-${{ matrix.arch }}-self-contained-${{ inputs.version }}
        path: ./publish/${{ matrix.arch }}/published/*
        if-no-files-found: error

    - name: Package release archive ${{ matrix.arch }}
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $name = '${{ steps.distribution.outputs.package-id }}-${{ matrix.arch }}-self-contained-${{ inputs.version }}.zip'
        $files = @(Get-ChildItem -LiteralPath './publish/${{ matrix.arch }}/published' -File | Select-Object -ExpandProperty FullName)
        zip -j $name @files

    - name: Upload release archive ${{ matrix.arch }}
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ steps.distribution.outputs.package-id }}-${{ matrix.arch }}-self-contained-${{ inputs.version }}.zip
        path: ${{ steps.distribution.outputs.package-id }}-${{ matrix.arch }}-self-contained-${{ inputs.version }}.zip
        if-no-files-found: error
