# Experiment branch only. Do not merge this replacement for normal PR/main CI.
name: Experiment · Oracle scoped pooling

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-pooling-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle:
    name: Oracle paired ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            order: baseline-first
          - framework: net9.0
            order: scoped-first
          - framework: net10.0
            order: baseline-first
          - framework: net11.0
            order: scoped-first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100
      - name: Build the same test binary for both variants
        shell: pwsh
        run: dotnet build unittests/Oracle/Oracle.csproj -c Debug '-p:TargetFrameworks=${{ matrix.framework }}'
      - name: Run complete paired Oracle suites with resource sampling
        shell: pwsh
        run: ./scripts/ci/Invoke-OraclePoolingExperiment.ps1 -Framework '${{ matrix.framework }}' -Order '${{ matrix.order }}' -ResultsDirectory '${{ runner.temp }}/oracle-experiment'
      - name: Upload all experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-pooling-${{ matrix.framework }}
          path: ${{ runner.temp }}/oracle-experiment/
          if-no-files-found: error
          retention-days: 7
