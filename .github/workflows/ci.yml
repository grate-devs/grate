name: Oracle ARM64 MSI live checkpoints
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Oracle ARM64 phase replay
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      STANDALONE_VERSION: '0.0.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify native architecture
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'Arm64') {
            throw 'MSI replay must execute natively on ARM64.'
          }
      - name: Build and verify the Oracle CLI
        shell: pwsh
        run: ./scripts/verify-packages.ps1 -Kind Standalone -Distribution Oracle -RuntimeIdentifier win-arm64 -StandaloneVersion $env:STANDALONE_VERSION -OutputDirectory "${{ runner.temp }}/grate-cli" -RunSmokeTest
      - name: Build and verify the actual MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = ./installers/msi/helpers/Get-InstallerIdentity.ps1 -Version $env:STANDALONE_VERSION -Distribution Oracle -Architecture arm64
          "MSI_PACKAGE_ID=$($identity.PackageId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./installers/msi/Create-Installer.ps1 -grateExe "${{ runner.temp }}/grate-cli/published/grate.exe" -Version $env:STANDALONE_VERSION -Distribution Oracle -arch arm64
          ./installers/msi/tests/Test-InstallerMetadata.Tests.ps1 -MsiPath "installers/msi/tmp/$($identity.PackageId)-$env:STANDALONE_VERSION.msi" -ExpectedVersion $env:STANDALONE_VERSION -Distribution Oracle -ExpectedArchitecture arm64
      - name: Launch detached unchanged lifecycle diagnostic
        id: launch
        timeout-minutes: 2
        shell: pwsh
        run: |
          $parameters = @{
            MsiPath = "./installers/msi/tmp/$env:MSI_PACKAGE_ID-$env:STANDALONE_VERSION.msi"
            PublishedExecutable = "${{ runner.temp }}/grate-cli/published/grate.exe"
            Architecture = 'arm64'
            Distribution = 'Oracle'
            OutputDirectory = "${{ runner.temp }}/grate-msi-lifecycle"
          }
          ./installers/msi/tests/support/Start-MsiDiagnosticReplayDetached.ps1 -Parameters $parameters -DeadlineSeconds 450
      - name: Capture checkpoint one while replay may be active
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "${{ runner.temp }}/grate-msi-lifecycle-detached/launch.json") {
            Start-Sleep -Seconds 45
          }
          ./installers/msi/tests/support/Copy-MsiReplayCheckpoint.ps1 -LifecycleDirectory "${{ runner.temp }}/grate-msi-lifecycle" -OutputDirectory "${{ runner.temp }}/msi-checkpoint-1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: oracle-arm64-msi-checkpoint-1
          path: ${{ runner.temp }}/msi-checkpoint-1/**
          retention-days: 3
      - name: Capture checkpoint two while replay may be active
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "${{ runner.temp }}/grate-msi-lifecycle-detached/launch.json") {
            Start-Sleep -Seconds 45
          }
          ./installers/msi/tests/support/Copy-MsiReplayCheckpoint.ps1 -LifecycleDirectory "${{ runner.temp }}/grate-msi-lifecycle" -OutputDirectory "${{ runner.temp }}/msi-checkpoint-2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: oracle-arm64-msi-checkpoint-2
          path: ${{ runner.temp }}/msi-checkpoint-2/**
          retention-days: 3
      - name: Require atomic full replay completion
        if: ${{ always() && steps.launch.outcome == 'success' }}
        timeout-minutes: 9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "${{ runner.temp }}/grate-msi-lifecycle-detached"
          $launch = Get-Content -LiteralPath "$directory/launch.json" -Raw | ConvertFrom-Json
          $limit = ([DateTime]$launch.StartedUtc).ToUniversalTime().AddSeconds($launch.DeadlineSeconds + 30)
          $completionPath = "$directory/entry-completion.json"
          while (!(Test-Path -LiteralPath $completionPath)) {
            if ([DateTime]::UtcNow -ge $limit) {
              throw 'Atomic MSI replay completion was not published within its deadline; partial phase checkpoints remain diagnostic only.'
            }
            Start-Sleep -Seconds 1
          }
          $completion = Get-Content -LiteralPath $completionPath -Raw | ConvertFrom-Json
          if (!$completion.Succeeded -or !$completion.ReplayReturned -or !$completion.CompletedUtc) {
            throw 'Detached MSI replay failed or returned without complete lifecycle evidence.'
          }
          Write-Host 'Unchanged MSI lifecycle completed; atomic replay completion verified.'
      - name: Capture final phase state
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: ./installers/msi/tests/support/Copy-MsiReplayCheckpoint.ps1 -LifecycleDirectory "${{ runner.temp }}/grate-msi-lifecycle" -OutputDirectory "${{ runner.temp }}/msi-checkpoint-final"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: oracle-arm64-msi-checkpoint-final
          path: ${{ runner.temp }}/msi-checkpoint-final/**
          retention-days: 3
