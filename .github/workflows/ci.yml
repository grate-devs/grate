# EXPERIMENT ONLY: selected net11 profiling does not replace the full CI matrix.
name: Experiment · SQL Server profile

on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        description: Measurement design
        options: [Observer, Pooling, Diagnose]
        default: Observer
      expected_tests:
        type: number
        description: Exact expected executed case count
        default: 276

permissions:
  contents: read

jobs:
  measure:
    name: SQL Server controlled measurements
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned SDK and supported runtimes
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Check measurement controls
        shell: pwsh
        run: ./scripts/Measure-SqlServerCi.ps1 -SelfTest
      - name: Measure the same prepared Debug binary
        shell: pwsh
        env:
          MEASUREMENT_EXPERIMENT: ${{ inputs.experiment }}
          MEASUREMENT_EXPECTED_TESTS: ${{ inputs.expected_tests }}
        run: ./scripts/Measure-SqlServerCi.ps1 -OutputDirectory "${{ runner.temp }}/sqlserver-profile" -Experiment $env:MEASUREMENT_EXPERIMENT -ExpectedTests $env:MEASUREMENT_EXPECTED_TESTS
      - name: Retain sanitized measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sqlserver-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlserver-profile/
          if-no-files-found: error
          retention-days: 7
