name: MSI regression evidence controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    name: MSI controls ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: X64
          - runner: windows-11-arm
            arch: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native architecture
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -cne $env:EXPECTED_ARCH) {
            throw 'MSI controls must run on their native architecture.'
          }
      - name: Run native component controls
        timeout-minutes: 2
        shell: pwsh
        run: ./installers/msi/tests/support/Test-MsiLifecycleNativeProcess.Tests.ps1 -OutputDirectory "${{ runner.temp }}/msi-native-controls"
      - name: Run all eight supervisor cases
        timeout-minutes: 2
        shell: pwsh
        run: ./installers/msi/tests/Test-MsiLifecycleSupervisor.Tests.ps1
      - name: Reject missing worker termination before cleanup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $PSStyle.OutputRendering = 'PlainText'
          $directory = Join-Path $env:RUNNER_TEMP 'msi-missed-kill-control'
          $support = Join-Path $directory 'tests/support'
          New-Item -ItemType Directory -Path $support -Force | Out-Null
          Copy-Item -LiteralPath './installers/msi/InstallerLifecycle.Diagnostics.ps1' -Destination $directory
          foreach ($name in @('MsiLifecycle.NativeProcess.cs', 'MsiLifecycle.Worker.ps1')) {
            Copy-Item -LiteralPath "./installers/msi/tests/support/$name" -Destination $support
          }
          $source = Get-Content -LiteralPath './installers/msi/tests/support/Invoke-MsiLifecycle.ps1' -Raw
          $needle = '        $process.Kill()'
          if ([regex]::Matches($source, [regex]::Escape($needle)).Count -ne 1) {
            throw 'Expected exactly one owned worker termination to mutate.'
          }
          $mutant = Join-Path $support 'Invoke-MsiLifecycle.ps1'
          $source.Replace($needle, '        # Deliberately omit termination in this controlled mutant.') |
            Set-Content -LiteralPath $mutant
          $runner = Join-Path $directory 'run-mutant.ps1'
          @'
          param([string]$TestPath, [string]$SupervisorPath, [string]$FailurePath)
          $ErrorActionPreference = 'Stop'
          try {
              & $TestPath -SupervisorPath $SupervisorPath -Cases WorkerHang
              exit 0
          } catch {
              $_.Exception.Message | Set-Content -LiteralPath $FailurePath
              exit 1
          }
          '@ | Set-Content -LiteralPath $runner
          $failure = Join-Path $directory 'assertion.txt'
          $arguments = @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-File',
            $runner, '-TestPath', (Resolve-Path './installers/msi/tests/Test-MsiLifecycleSupervisor.Tests.ps1').Path,
            '-SupervisorPath', $mutant, '-FailurePath', $failure
          )
          $output = & (Join-Path $PSHOME 'pwsh.exe') @arguments 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -LiteralPath (Join-Path $directory 'mutant-output.log')
          if ($exitCode -eq 0) {
            throw 'The missed-termination mutant was incorrectly accepted.'
          }
          # Reject the mutant only at the intended pre-cleanup assertion.
          if (!(Test-Path -LiteralPath $failure) -or
              (Get-Content -LiteralPath $failure -Raw).Trim() -cne 'WorkerHang timed-out worker did not retain its terminated exit code.') {
            throw 'The mutant failed without the intended worker-termination assertion.'
          }
          @{ ExitCode = $exitCode; ExpectedRejection = $true } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'result.json')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: msi-regression-controls-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/msi-native-controls/**
            ${{ runner.temp }}/lifecycle/supervisor contract evidence/**
            ${{ runner.temp }}/msi-missed-kill-control/**
          retention-days: 3
