name: MSI outer-pipe EOF probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outer-pipes:
    name: Outer pipes ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest }
          - { arch: arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native architecture
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant() -ne '${{ matrix.arch }}') {
            throw 'Outer-pipe proof must execute natively.'
          }
      - name: Check outer EOF and intentional inherited-pipe control
        timeout-minutes: 3
        shell: pwsh
        run: ./installers/msi/tests/Test-MsiLifecycleOuterPipes.Tests.ps1 -OutputDirectory "${{ runner.temp }}/msi-outer-pipes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: outer-pipes-${{ matrix.arch }}
          path: ${{ runner.temp }}/msi-outer-pipes/**
          retention-days: 3
