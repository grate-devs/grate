# TEST ONLY: synthetic producers exercise the real PR validation scripts.
# No real build, test, package, native platform, or security coverage is claimed.
# This workflow targets only the isolated fixture base; never merge it to main.
name: CI
on:
  pull_request:
    branches: [ci/pr-validation-fixture-base]
permissions:
  contents: read
jobs:
  validation-policy:
    name: PR validation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Test aggregate decision policy
      shell: pwsh
      run: |
        ./scripts/ci/Test-PRValidation.ps1
        ./scripts/ci/Test-InvokePRValidation.ps1

  pr-validation:
    # Keep this name stable: the proposed main ruleset consumes it.
    name: PR validation
    if: always()
    needs: [validation-policy, build-code, test, packages, standalone, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Require every build, test and package producer
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: ./scripts/ci/Invoke-PRValidation.ps1

  build-code:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: "Restore dependencies"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Build"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC NEGATIVE: producer failure with green report.'; exit 1"
  test:
    name: "Run tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - {"os": "ubuntu-latest", "category": "Basic_tests", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "SqlServer", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "SqlServerCaseSensitive", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "PostgreSQL", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "MariaDB", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "Sqlite", "test_filter": ""}
        - {"os": "ubuntu-latest", "category": "Oracle", "test_filter": ""}
        - {"os": "windows-latest", "category": "Basic_tests", "test_filter": ""}
        - {"os": "windows-latest", "category": "Sqlite", "test_filter": ""}
        - {"os": "windows-latest", "category": "SqlServer", "test_filter": "SqlServer.Basic_tests.*"}
        - {"os": "windows-latest", "category": "SqlServerCaseSensitive", "test_filter": "SqlServerCaseSensitive.Basic_tests.*"}
        - {"os": "windows-latest", "category": "MariaDB", "test_filter": "MariaDB.Basic_tests.*"}
        - {"os": "windows-latest", "category": "Oracle", "test_filter": "Oracle.Basic_tests.*"}
    steps:
    - name: "Test on Linux"
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Test on Windows"
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
  report:
    name: Create test report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
    - name: "Create synthetic successful report"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
  packages:
    name: "NuGet libraries and installed tool"
    runs-on: ubuntu-latest
    steps:
    - name: "Check standalone verification command contract"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Verify packages across supported frameworks"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
  standalone:
    name: "CLI ${{ matrix.rid }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - {"rid": "win-x64"}
        - {"rid": "win-x86"}
        - {"rid": "win-arm64"}
        - {"rid": "linux-x64"}
        - {"rid": "linux-arm64"}
        - {"rid": "linux-musl-x64"}
        - {"rid": "linux-musl-arm64"}
        - {"rid": "osx-x64"}
        - {"rid": "osx-arm64"}
    steps:
    - name: "Verify self-contained runtime and execution"
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Check per-user MSI authoring regressions"
      if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Build MSI from verified Windows binary"
      if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Check verified Windows MSI metadata"
      if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
      shell: pwsh
      run: "Write-Host 'SYNTHETIC PRODUCER: no real build, test or package work is performed.'"
    - name: "Verify installed MSI, major upgrade and uninstall"
      if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
