# Build, security analysis, and the full database/runtime test matrix for PRs.
name: CI · Build and tests
run-name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && inputs.cli-scheduling || '' }}

on:
  # Feature branches are validated through PRs; main also needs a CodeQL baseline.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Refresh the main baseline with new queries without rerunning the test matrix.
    - cron: '23 5 * * 1'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      cli-scheduling:
        description: CLI scheduling to measure on the pilot branch
        type: choice
        default: baseline
        options: [baseline, early]

permissions:
  contents: read

# Replace obsolete test runs without letting a manual branch run cancel a PR's
# merge-ref validation. Publishing on main is handled by build.yml separately.
concurrency:
  # Keep a stalled measurement from holding the other pilot schedule's group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && format('-{0}', inputs.cli-scheduling || 'baseline') || '' }}
  cancel-in-progress: true

jobs:
  validation-policy:
    name: PR validation policy
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check build-independent contracts
      uses: ./.github/actions/preflight

  pr-validation:
    # Keep this name stable: the proposed main ruleset consumes it.
    name: PR validation
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    needs: [validation-policy, build-code, fast-tests-linux, fast-tests-windows, test, cli-distributions, cli-distributions-early, packages, standalone, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Require every build, test and package producer
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS_JSON: ${{ toJSON(needs) }}
        CLI_SCHEDULING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && inputs.cli-scheduling || 'baseline' }}
      run: ./scripts/ci/Invoke-PRValidation.ps1

  build-code:
    name: Build
    needs: validation-policy
    uses: ./.github/workflows/ci-build.yml

  fast-tests-linux:
    name: Isolated tests
    needs: validation-policy
    uses: ./.github/workflows/ci-fast-tests.yml
    with:
      os: ubuntu-latest

  fast-tests-windows:
    name: Isolated tests
    needs: validation-policy
    uses: ./.github/workflows/ci-fast-tests.yml
    with:
      os: windows-latest

  analyze:
    name: Security analysis
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.build-code.result == 'success' && needs.fast-tests-linux.result == 'success' && needs.fast-tests-windows.result == 'success' && needs.validation-policy.result == 'success')) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security-analysis.yml

  test:
    name: Database tests
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    uses: ./.github/workflows/ci-database-tests.yml

  cli-distributions:
    name: CLI distributions
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && inputs.cli-scheduling == 'early') }}
    uses: ./.github/workflows/ci-cli-distributions.yml

  cli-distributions-early:
    name: CLI distributions
    needs: [build-code, fast-tests-linux, validation-policy]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && inputs.cli-scheduling == 'early' }}
    uses: ./.github/workflows/ci-cli-distributions.yml

  report:
    # Diagnostic artifact. The test producers gate CI independently.
    name: Test report
    needs: [fast-tests-linux, fast-tests-windows, test, cli-distributions, cli-distributions-early]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci-report.yml

  packages:
    name: Packages
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    uses: ./.github/workflows/ci-packages.yml

  standalone:
    name: Standalone CLI
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    uses: ./.github/workflows/ci-standalone.yml

  docker:
    name: Docker
    needs: [build-code, fast-tests-linux, fast-tests-windows, validation-policy]
    uses: ./.github/workflows/ci-docker.yml

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A skipped dependent job can look green in isolation. Only this aggregate
    # evaluates the required phases, including early failures and cancellations.
    needs: [build-code, fast-tests-linux, fast-tests-windows, analyze, test, cli-distributions, cli-distributions-early, packages, standalone, docker, validation-policy, pr-validation]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7
      - name: Require successful results from every required CI phase
        shell: pwsh
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CLI_SCHEDULING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/942-cli-scheduling-pilot' && inputs.cli-scheduling || 'baseline' }}
        run: ./scripts/Assert-CiResults.ps1 -NeedsJson $env:CI_NEEDS_JSON -CliScheduling $env:CLI_SCHEDULING
