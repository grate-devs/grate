# Called by build.yml; source checkout always uses the caller's immutable event SHA.
name: Release · libraries

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      core-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  main:
    name: Build Nuget

    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [
                "grate.bigquery",
                "grate.core",
                "grate.mariadb",
                "grate.oracle",
                "grate.postgresql",
                "grate.sqlite",
                "grate.sqlserver"
              ]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Setup .NET 11 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; #830 redirect sanitization
      with:
         global-json-file: global.json
         dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Pack Nuget package ${{ matrix.package }}
      run: dotnet pack ./src/${{ matrix.package }} -c Release --include-symbols -o /tmp/grate/nupkg /p:Version=${{ env.VERSION }} -p:PackageVersion=${{ inputs.version }}
      env:
        VERSION: ${{ inputs.core-version }}

    - name: Upload NuGet package ${{ matrix.package }}
      uses: actions/upload-artifact@v7
      with:
        name: nuget-${{ matrix.package }}-${{ inputs.version }}
        path: /tmp/grate/nupkg/*
        if-no-files-found: error
