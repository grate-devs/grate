name: CI · Docker distribution policy

on:
  pull_request:
    paths:
      - '.github/workflows/docker-*.yml'
      - '.github/workflows/build.yml'
      - 'build-docker-local.ps1'
      - 'installers/docker/**'
      - 'scripts/release/**'
  workflow_dispatch:
    inputs:
      local_registry_check:
        description: Run the disposable loopback-registry check (local fixture image publication)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preflight
      - name: Exercise loopback-registry publication only when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.local_registry_check == true }}
        shell: pwsh
        run: ./installers/docker/tests/check_local_registry.ps1
