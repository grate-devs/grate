# Build every release format. Publishing is enabled only for a GitHub release.
name: Release · Build artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/release-*.yml"
      - ".github/actions/setup-dotnet-macos-arm64/**"
      - "Directory.*"
      - "GitVersion.yml"
      - "scripts/release/**"
      - "scripts/verify-packages.ps1"
      - "scripts/ci/Distribution.Common.ps1"
      - "installers/**"
      - "src/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag; also select this tag as the workflow ref"
        required: false
        type: string
      publish:
        description: "Publish to the existing GitHub release and external registries"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  set-version-number:
    name: Resolve release context
    needs: validate-release-policy
    runs-on: ubuntu-latest
    outputs:
      nuGetVersion: ${{ steps.release-context.outputs.core_version }}
      semVer: ${{ steps.release-context.outputs.version }}
      is-release: ${{ steps.release-context.outputs.publish }}
      is-prerelease: ${{ steps.release-context.outputs.prerelease }}
      release-tag: ${{ steps.release-context.outputs.release_tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Setup .NET 11 RC3 and .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
    - name: Install GitVersion
      if: ${{ github.event_name != 'release' && inputs.release_tag == '' }}
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'
    - name: Determine version
      if: ${{ github.event_name != 'release' && inputs.release_tag == '' }}
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Resolve and validate release context
      id: release-context
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_ACTION: ${{ github.event.action }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        RELEASE_DRAFT: ${{ github.event.release.draft }}
        MANUAL_TAG: ${{ inputs.release_tag }}
        MANUAL_PUBLISH: ${{ inputs.publish }}
        GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: ./scripts/release/resolve_release_context.ps1
    # Keep the event ref/cache scope and executed source together. Inputs never select a checkout.
    - name: Verify release tag identifies the event commit
      env:
        RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$RELEASE_TAG" ]]; then
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag must identify the workflow event commit."
            exit 1
          fi
        fi

  validate-release-policy:
    name: Test release policy without publishing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check build-independent contracts
      uses: ./.github/actions/preflight

  build-netcore-tool:
    name: Build .NET Core (global) tool
    needs: [set-version-number]
    uses: ./.github/workflows/release-tools.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}

  build-nuget-package:
    name: Build Nuget
    needs: [set-version-number]
    uses: ./.github/workflows/release-libraries.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      core-version: ${{ needs.set-version-number.outputs.nuGetVersion }}

  # Keep the NuGet credential job here: its trusted-publisher policy identifies
  # build.yml via job_workflow_ref. Reusable publishers would change that claim.
  publish-nuget:
    name: Publish NuGet packages
    needs:
      - set-version-number
      - release-ready
      - publish-github-release
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Setup .NET CLI from the selected source
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; #830
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        pattern: nuget-*-${{ needs.set-version-number.outputs.semVer }}
        path: artifacts/nuget
        merge-multiple: true

    - name: Validate NuGet publishing identity
      shell: bash
      env:
        NUGET_USER: ${{ secrets.NUGET_USER }}
      run: |
        set -euo pipefail
        if [ -z "$NUGET_USER" ]; then
          echo "::error::NUGET_USER is not configured for NuGet trusted publishing."
          exit 1
        fi

    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push packages to NuGet.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        VERSION: ${{ needs.set-version-number.outputs.semVer }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        . ./scripts/release/distribution_profiles.ps1
        $packages = @(Get-GrateReleaseNugetPackages -Directory artifacts/nuget -Version $env:VERSION)
        foreach ($package in $packages) {
          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
        }

  build-standalone:
    name: Build CLI archives
    needs: [set-version-number]
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      runner: ubuntu-latest
      runtime-identifiers: '["win-x64","win-x86","win-arm64","linux-musl-x64","linux-musl-arm64","linux-x64","linux-arm64","osx-x64"]'
      native-arm-sdk: false

  build-standalone-mac-arm64:
    name: Build CLI archives
    needs: [set-version-number]
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      runner: macos-15
      runtime-identifiers: '["osx-arm64"]'
      native-arm-sdk: true

  build-msi:
    name: Build MSI
    needs: [set-version-number, build-standalone]
    uses: ./.github/workflows/release-msi.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      core-version: ${{ needs.set-version-number.outputs.nuGetVersion }}

  build-docker-image:
    name: Build and verify Docker OCI archive without publishing
    needs: [set-version-number]
    uses: ./.github/workflows/release-docker-build.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}

  build-chocolatey:
    name: Build Chocolatey package
    needs: [set-version-number, build-standalone]
    uses: ./.github/workflows/release-chocolatey.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      release-tag: ${{ needs.set-version-number.outputs.release-tag }}

  build-slim-docker-images:
    name: Build and verify Docker archive
    needs: [set-version-number]
    uses: ./.github/workflows/release-docker-slim-build.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}

  build-deb:
    name: Build Debian package
    needs: [set-version-number, build-standalone]
    uses: ./.github/workflows/release-debian.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}

  release-ready:
    name: Release contract ready
    needs: [set-version-number, validate-release-policy, build-netcore-tool, build-nuget-package, build-standalone, build-standalone-mac-arm64, build-msi, build-docker-image, build-slim-docker-images, build-chocolatey, build-deb]
    if: ${{ always() }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-validate.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      release-tag: ${{ needs.set-version-number.outputs.release-tag }}
      required-results: ${{ toJSON(needs) }}

  publish-github-release:
    name: Publish assets to the existing GitHub release
    needs: [set-version-number, release-ready]
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-github.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      release-tag: ${{ needs.set-version-number.outputs.release-tag }}

  publish-docker:
    name: Publish canonical Docker image and compatibility digest
    needs: [set-version-number, build-docker-image, release-ready, publish-github-release]
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/release-docker-publish.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}
      expected-digest: ${{ needs.build-docker-image.outputs.digest }}
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}

  publish-slim-docker:
    name: Publish verified Docker archive
    needs: [set-version-number, build-slim-docker-images, release-ready, publish-github-release]
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/release-docker-slim-publish.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}
      publish: ${{ needs.set-version-number.outputs.is-release }}

  prepare-winget:
    name: Prepare WinGet candidates (no submission)
    needs: [set-version-number, release-ready, publish-github-release]
    if: ${{ needs.set-version-number.outputs.is-release == 'true' && needs.set-version-number.outputs.is-prerelease != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-winget.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      release-tag: ${{ needs.set-version-number.outputs.release-tag }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}

  publish-homebrew:
    name: Update all Homebrew casks and retain formula candidates
    needs: [set-version-number, release-ready, publish-github-release]
    if: ${{ needs.set-version-number.outputs.is-release == 'true' && needs.set-version-number.outputs.is-prerelease != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-homebrew.yml
    with:
      version: ${{ needs.set-version-number.outputs.semVer }}
      release-tag: ${{ needs.set-version-number.outputs.release-tag }}
      publish: ${{ needs.set-version-number.outputs.is-release }}
      prerelease: ${{ needs.set-version-number.outputs.is-prerelease }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  test:
    name: Run tests
    needs: [set-version-number]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
    uses: ./.github/workflows/release-tests.yml
