# Heavyweight build and test
name: Build and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/
  workflow_dispatch:
  
jobs:
  set-version-number:
    name: Set version number
    runs-on: ubuntu-latest
    outputs:
      nuGetVersion: ${{ steps.gitversion.outputs.majorMinorPatch }}
      semVer: ${{ steps.gitversion.outputs.fullSemVer }}
      is-release: ${{ steps.gitversion.outputs.versionSourceDistance == 0 }}
      #is-release: 'true'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET 11 RC3 and .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    
    
    - name: Display Version Information
      run: |
        echo "MajorMinorPatch: ${{ steps.gitversion.outputs.MajorMinorPatch }}"
        echo "versionSourceDistance: ${{ steps.gitversion.outputs.versionSourceDistance }}"
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"

  build-netcore-tool:
    needs: set-version-number
    name: Build .NET Core (global) tool

    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required to get Github JWT to auth to Nuget
      contents: write
      
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11 RC3 and .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet pack ./src/grate/grate.csproj -p:SelfContained=false -p:PackAsTool=true -p:PackageOutputPath=/tmp/grate/nupkg -p:version=${{ needs.set-version-number.outputs.nuGetVersion }} -p:PackageVersion=${{ needs.set-version-number.outputs.semVer }} # Preserve per-framework tool assets; RID packaging remains disabled for #714
      
    - name: Upload published tool artifact
      uses: actions/upload-artifact@v7
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      with:
        name: grate-dotnet-tool-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: /tmp/grate/nupkg/*
          
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: Push to Nuget.org
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: dotnet nuget push /tmp/grate/nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate
  
  build-nuget-package:
    needs: set-version-number
    name: Build Nuget

    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [
                "grate.core",
                "grate.mariadb",
                "grate.oracle",
                "grate.postgresql",
                "grate.sqlite",
                "grate.sqlserver"
              ]
    permissions:
      id-token: write  # Required to get Github JWT to auth to Nuget
      contents: read
      
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET 11 RC3 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
         global-json-file: global.json
         dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Pack Nuget package ${{ matrix.package }}
      run: dotnet pack ./src/${{ matrix.package }} -c Release --include-symbols -o /tmp/grate/nupkg /p:Version=${{ env.VERSION }} -p:PackageVersion=${{ needs.set-version-number.outputs.semVer }}
      env:
        VERSION: ${{ needs.set-version-number.outputs.nuGetVersion }}
      
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
      
    - name: Push to Nuget.org
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: dotnet nuget push /tmp/grate/nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate

  build-standalone:
    name: Build cli
    needs: set-version-number

    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ "win-x64", "win-x86", "win-arm64",
                "linux-musl-x64", "linux-musl-arm64", "linux-x64", "linux-arm64",
                "osx-x64" 
              ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11 RC3 and .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Publish self-contained ${{ matrix.arch }}
      run: dotnet publish ./src/grate/grate.csproj -r ${{ matrix.arch }} -c release --self-contained -p:SelfContained=true -o ./publish/${{ matrix.arch }}/self-contained
      env:
        VERSION: ${{ needs.set-version-number.outputs.nuGetVersion }}
        TargetFramework: net11.0


    - name: Upload self-contained ${{ matrix.arch }}
      #if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: ./publish/${{ matrix.arch }}/self-contained/*

    - name: Publish artifact ${{ matrix.arch }}
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: |
        name=grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}.zip
        zip -j $name ./publish/${{ matrix.arch }}/self-contained/*
        gh release upload ${{ needs.set-version-number.outputs.semVer }} $name --clobber
      env:
        GH_TOKEN: ${{ github.token }}


  build-standalone-mac-arm64:
    name: Build cli
    needs: set-version-number

    # Use macos-15 to build osx-arm64, it runs on M1, see 
    # https://github.blog/changelog/2024-01-30-github-actions-introducing-the-new-m1-macos-runner-available-to-open-source/
    #
    # I've earlier had problems with that the trimmed, self-contained binary for osx-arm64 that was built on Linux
    # did not work when opened on an actual mac with arm64.

    runs-on: macos-15
    strategy:
      matrix:
        arch: [ "osx-arm64" ]

    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11 RC3 and .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Publish self-contained ${{ matrix.arch }}
      run: dotnet publish ./src/grate/grate.csproj -r ${{ matrix.arch }} -c release --self-contained -p:SelfContained=true -o ./publish/${{ matrix.arch }}/self-contained
      env:
        VERSION: ${{ needs.set-version-number.outputs.nuGetVersion }}
        TargetFramework: net11.0

    - name: Upload self-contained ${{ matrix.arch }}
      #if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: ./publish/${{ matrix.arch }}/self-contained/*
    
    - name: Publish artifact ${{ matrix.arch }}
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: |
        name=grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}.zip
        zip -j $name ./publish/${{ matrix.arch }}/self-contained/*
        gh release upload ${{ needs.set-version-number.outputs.semVer }} $name --clobber
      env:
        GH_TOKEN: ${{ github.token }}
  
  build-msi:
    name: Build MSI
    needs: 
     - set-version-number
     - build-standalone
    runs-on: windows-latest
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    strategy:
      matrix:
        arch: [ "win-x64", "win-arm64" ]

    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: ${{ matrix.arch }}/

    # WiX takes an architecture (x64/arm64), while the matrix uses win-* RIDs.
    - name: Create msi
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: ./installers/msi/Create-Installer.ps1 -grateExe ./${{ matrix.arch }}/grate.exe -Version "${{ needs.set-version-number.outputs.nuGetVersion }}" -arch ("${{ matrix.arch }}" -replace "win-", "")
      env:
        VERSION: ${{ needs.set-version-number.outputs.nuGetVersion }}

    - name: Upload MSI ${{ matrix.arch }}
      uses: actions/upload-artifact@v7
      with:
        name: grate-msi-${{ matrix.arch }}-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: ./installers/msi/tmp/*.msi
    
    - name: Publish artifact ${{ matrix.arch }}
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      shell: pwsh
      run: |
        $name = "grate-msi-${{ matrix.arch }}-${{ needs.set-version-number.outputs.nuGetVersion }}.msi"
        $msiFile = Get-ChildItem -Path ./installers/msi/tmp -Filter *.msi | Select-Object -First 1
        Copy-Item $msiFile.FullName -Destination $name
        gh release upload ${{ needs.set-version-number.outputs.semVer }} $name --clobber
      env:
        GH_TOKEN: ${{ github.token }}


  build-docker-image:
    name: Build Docker image without publishing
    needs: set-version-number
    if: ${{ needs.set-version-number.outputs.is-release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build current source without registry credentials
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ./installers/docker/Dockerfile
        context: .
        platforms: linux/amd64,linux/arm64
        pull: true
        push: false
        build-args: |
          VERSION=${{ needs.set-version-number.outputs.semVer }}

  publish-docker:
    name: Publish canonical Docker image and compatibility digest
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    environment: docker-hub
    needs: set-version-number
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    # Serialize version/latest publication across release runs.
    concurrency:
      group: docker-publication
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Configure isolated canonical Docker credentials
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/grate-oidc-docker"
        chmod 700 "$RUNNER_TEMP/grate-oidc-docker"
        echo "DOCKER_CONFIG=$RUNNER_TEMP/grate-oidc-docker" >> "$GITHUB_ENV"

    - name: Check Docker release policy
      run: |
        python3 -m unittest discover -s installers/docker -p 'test_*.py'
        python3 -m unittest discover -s eng -p 'test_*docker*.py'

    - name: Select identical tags for canonical and compatibility names
      id: tags
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      env:
        VERSION: ${{ needs.set-version-number.outputs.semVer }}
        # #804 integration: use needs.set-version-number.outputs.is-prerelease
        # here, including manual recovery. Current main has no such output.
        PRERELEASE: ${{ github.event.release.prerelease || false }}
      shell: bash
      run: |
        args=()
        if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
        python3 installers/docker/release_tags.py "$VERSION" "${args[@]}" --github-output "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver: docker-container

    - name: Prepare canonical OIDC login and digest-preserving copy tool
      env:
        CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      shell: bash
      run: |
        set -euo pipefail
        test -n "$CONNECTION_ID" || { echo '::error::DOCKERHUB_OIDC_CONNECTIONID must be configured in docker-hub.'; exit 1; }
        mkdir -p "$DOCKER_CONFIG"
        chmod 700 "$DOCKER_CONFIG"
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends skopeo
        skopeo --version >> "$GITHUB_STEP_SUMMARY"

    - name: Log in to canonical Docker Hub repository using OIDC
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        # Cover the bounded 45-minute build/copy job, including an uncached build.
        DOCKERHUB_OIDC_EXPIREIN: '3600'
      with:
        username: gratedevs

    - name: Verify separate publishing identities without registry writes
      env:
        DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      run: python3 eng/check_docker_access.py --canonical-authfile "$DOCKER_CONFIG/config.json" --report docker-access.json

    - name: Retain OCI image labels
      id: meta
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: gratedevs/grate
        flavor: latest=false
        tags: type=raw,value=${{ steps.tags.outputs.version }}

    # The organization identity can publish only the canonical name.
    # Compatibility is an immutable digest copy, never a second application build.
    - name: Build and push Docker image
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ./installers/docker/Dockerfile
        context: .
        platforms: linux/amd64,linux/arm64
        pull: true
        push: ${{ needs.set-version-number.outputs.is-release == 'true' }}
        tags: ${{ steps.tags.outputs.canonical-tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.tags.outputs.version || needs.set-version-number.outputs.semVer }}

    - name: Copy the built digest to the compatibility repository
      id: compatibility
      env:
        DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      run: python3 eng/copy_docker_release.py --source-authfile "$DOCKER_CONFIG/config.json" --report docker-compatibility.json

    - name: Verify every published tag against the built digest
      if: ${{ always() && needs.set-version-number.outputs.is-release == 'true' && steps.tags.outputs.tags != '' }}
      env:
        DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        BUILD_OUTCOME: ${{ steps.image.outcome }}
      # Public read-back deliberately does not use the legacy credential for canonical access.
      run: python3 eng/verify_docker_release.py --report docker-publication.json

    - name: Retain publication results, including partial failures
      if: ${{ always() && needs.set-version-number.outputs.is-release == 'true' }}
      env:
        BUILD_OUTCOME: ${{ steps.image.outcome }}
        COPY_OUTCOME: ${{ steps.compatibility.outcome }}
        EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
      shell: bash
      run: |
        echo "Canonical build/push: $BUILD_OUTCOME; compatibility copy: $COPY_OUTCOME; built digest: $EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
        if [[ ! -f docker-publication.json ]]; then
          echo 'Publication did not reach verification. Some registry tags may already have changed; inspect both repositories before retrying.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Docker publication evidence
      if: ${{ always() && needs.set-version-number.outputs.is-release == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: docker-publication-${{ github.run_id }}-${{ github.run_attempt }}
        path: docker-*.json
        if-no-files-found: warn

  build-deb:
    name: Build Debian package
    needs: 
     - set-version-number
     - build-standalone
    runs-on: ubuntu-latest
    if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
    strategy:
      matrix:
        arch: [ "linux-arm64", "linux-x64" ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: grate-${{ matrix.arch }}-self-contained-${{ needs.set-version-number.outputs.nuGetVersion }}
        path: ${{ matrix.arch }}/

    - id: get-arch
      name: Get architecture
      run: |
        arch=$(echo ${{ matrix.arch }} | cut -d- -f2 | sed 's/x64/amd64/')
        echo "::set-output name=arch::$arch"

    - name: Create dpkg # Linux with powershell script? really? YES! :D
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: ./installers/deb/Create-Package.ps1 -grateExe ./${{ matrix.arch }}/grate -Version "${{ needs.set-version-number.outputs.nuGetVersion }}" -arch ${{ steps.get-arch.outputs.arch}}
      env:
        VERSION: ${{ needs.set-version-number.outputs.nuGetVersion }}

    - name: Upload .dpkg ${{ steps.get-arch.outputs.arch }}
      uses: actions/upload-artifact@v7
      with:
        name: grate_${{ needs.set-version-number.outputs.nuGetVersion }}-1_${{ steps.get-arch.outputs.arch}}.deb
        path: ./installers/deb/grate_${{ needs.set-version-number.outputs.nuGetVersion }}-1_${{ steps.get-arch.outputs.arch }}.deb
    
    - name: Publish artifact ${{ matrix.arch }}
      if: ${{ needs.set-version-number.outputs.is-release == 'true' }}
      run: |
        nameOld=./installers/deb/grate_${{ needs.set-version-number.outputs.nuGetVersion }}-1_${{ steps.get-arch.outputs.arch }}.deb
        name=grate_${{ needs.set-version-number.outputs.nuGetVersion }}_${{ steps.get-arch.outputs.arch }}.deb
        mv $nameOld $name
        gh release upload ${{ needs.set-version-number.outputs.semVer }} $name --clobber
      env:
        GH_TOKEN: ${{ github.token }}
  test:
    name: Run tests

    runs-on: ubuntu-latest
    strategy:
      matrix:
        category: [ "Basic_tests", "SqlServer", "PostgreSQL", "MariaDB", "Sqlite", "Oracle"  ]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11 RC3 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
      with:
         global-json-file: global.json
         dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Test
      # SDK 11 multi-TFM discovery requires an absolute project-file path.
      # The Sqlite lane also executes the SQL examples shipped with the skill.
      # Run TFMs sequentially so database fixtures do not compete on one runner.
      run: |
        dotnet test \
        --project "${{ github.workspace }}/unittests/${{ matrix.category }}/${{ matrix.category }}.csproj" \
        --max-parallel-test-modules 1 \
        --coverage \
        --coverage-output-format xml \
        --coverage-output /tmp/test-results/${{ matrix.category }}.xml
      env:
        LogLevel: Warning
        TZ: UTC
