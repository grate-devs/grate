# Called by build.yml; source checkout always uses the caller's immutable event SHA.
name: Release · tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  main:
    name: Run tests

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [ "Basic_tests", "SqlServer", "PostgreSQL", "MariaDB", "Sqlite", "Oracle"  ]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Setup .NET 11 and earlier
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; #830 redirect sanitization
      with:
         global-json-file: global.json
         dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Test
      run: |
        dotnet test \
        --project "$PWD/unittests/${{ matrix.category }}/${{ matrix.category }}.csproj" \
        --max-parallel-test-modules 1 \
        --report-xunit-junit \
        --results-directory /tmp/test-results/${{ matrix.category }} \
        --coverage \
        --coverage-output-format xml \
        --coverage-output /tmp/test-results/${{ matrix.category }}.xml
      env:
        LogLevel: Warning
        TZ: UTC

    - name: Retain test results even on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.category }}
        path: /tmp/test-results/
        if-no-files-found: warn
