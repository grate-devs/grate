# Reusable isolated tests phase. Scheduling and aggregate gates live in ci.yml.
name: CI · Isolated tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

permissions:
  contents: read

jobs:
  fast-tests:
    name: Run tests (${{ inputs.os }}, Basic_tests)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 11 and earlier
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; public-feed redirect sanitization (#830)
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test on ${{ runner.os }}
        shell: pwsh
        env:
          LogLevel: Warning
          TZ: UTC
          TEST_RESULTS_DIRECTORY: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/test-results/Basic_tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $testArgs = @(
            'test',
            '--project', "${{ github.workspace }}/unittests/Basic_tests/Basic_tests.csproj",
            '--max-parallel-test-modules', '1',
            '--minimum-expected-tests', '1',
            '--stop-on-fail', 'on',
            '--long-running', '60',
            '--timeout', '20m',
            '--results-directory', $env:TEST_RESULTS_DIRECTORY,
            '--report-xunit-trx',
            '--xunit-info',
            '--coverage',
            '--coverage-output-format', 'xml'
          )
          dotnet @testArgs
      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ inputs.os }} Basic_tests XML test results"
          path: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/test-results/Basic_tests/
          retention-days: 1
