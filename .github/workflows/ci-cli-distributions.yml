# Reusable cli distributions phase. Scheduling and aggregate gates live in ci.yml.
name: CI · CLI distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-distributions:
    name: CLI database ${{ matrix.distribution }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.database == 'Oracle' && 50 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: All, database: Sqlite }
          - { distribution: SQLite, database: Sqlite }
          - { distribution: All, database: SqlServer }
          - { distribution: SQLServer, database: SqlServer }
          - { distribution: All, database: SqlServerCaseSensitive }
          - { distribution: SQLServer, database: SqlServerCaseSensitive }
          - { distribution: All, database: PostgreSQL }
          - { distribution: PostgreSQL, database: PostgreSQL }
          - { distribution: All, database: MariaDB }
          - { distribution: MariaDB, database: MariaDB }
          - { distribution: All, database: Oracle }
          - { distribution: Oracle, database: Oracle }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100
      - name: Download selected distribution payload
        uses: actions/download-artifact@v8
        with:
          name: cli-profile-${{ matrix.distribution }}-linux-x64
          path: ${{ runner.temp }}/prepared-distribution
      - name: Download selected test payload
        uses: actions/download-artifact@v8
        with:
          name: cli-tests-${{ matrix.database }}-linux-x64
          path: ${{ runner.temp }}/prepared-tests
      - name: Test published CLI and installed tool against database
        shell: pwsh
        env:
          LogLevel: Warning
          TZ: UTC
        run: ./scripts/ci/Invoke-DistributionTests.ps1 -Distribution '${{ matrix.distribution }}' -Database '${{ matrix.database }}' -OutputDirectory '${{ runner.temp }}/distribution-tests' -PreparedDistributionDirectory '${{ runner.temp }}/prepared-distribution' -PreparedTestsDirectory '${{ runner.temp }}/prepared-tests'
      - name: Upload distribution test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: '${{ matrix.distribution }} ${{ matrix.database }} CLI XML test results'
          path: ${{ runner.temp }}/distribution-tests/results/
          if-no-files-found: warn
          retention-days: 3
      - name: Upload tested distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'cli-${{ matrix.distribution }}-${{ matrix.database }}'
          path: |
            ${{ runner.temp }}/distribution-tests/standalone/
            ${{ runner.temp }}/distribution-tests/packages/
            ${{ runner.temp }}/distribution-tests/grate.deps.json
          retention-days: 3
