# Called by build.yml; source checkout always uses the caller's immutable event SHA.
name: Release · docker build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: string
        required: true
      prerelease:
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the exact retained All OCI archive
        value: ${{ jobs.main.outputs.digest }}

permissions:
  contents: read

jobs:
  main:
    name: Build and verify Docker OCI archive without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build current source into a local archive
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ./installers/docker/Dockerfile
        context: .
        platforms: linux/amd64,linux/arm64
        pull: true
        push: false
        outputs: type=oci,dest=${{ runner.temp }}/grate-image.tar
        tags: gratedevs/grate:${{ inputs.version }}
        labels: |
          org.opencontainers.image.source=https://github.com/grate-devs/grate
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.version }}
        build-args: |
          VERSION=${{ inputs.version }}
    - name: Verify OCI archive and preflight intended publication before the release gate
      env:
        EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        VERSION: ${{ inputs.version }}
        PUBLISH: ${{ inputs.publish }}
        PRERELEASE: ${{ inputs.prerelease }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends skopeo
        $mode = @{ VerifyOnly = $true }
        if ($env:PUBLISH -eq 'true') {
          $env:DOCKER_TAGS = (./installers/docker/release_tags.ps1 -Version $env:VERSION -Prerelease:($env:PRERELEASE -eq 'true')) -join "`n"
          # Fail on an existing conflicting Docker version before any GitHub assets change.
          $mode = @{ PreflightOnly = $true }
        }
        ./scripts/release/publish_docker_archive.ps1 @mode -Archive "$env:RUNNER_TEMP/grate-image.tar" -Report "$env:RUNNER_TEMP/docker-archive-validation.json"
    - name: Retain the exact Docker artifact for gated publication
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: grate-docker-oci-${{ inputs.version }}
        path: |
          ${{ runner.temp }}/grate-image.tar
          ${{ runner.temp }}/docker-archive-validation.json
        if-no-files-found: error
