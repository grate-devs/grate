name: CLI performance experiments

on:
  pull_request:
    paths:
      - 'scripts/performance/**'
      - '.github/workflows/cli-performance.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: Samples per workload and extraction condition (per round)
        type: number
        default: 10
      include_aot:
        description: Also investigate Native AOT (failure is an experiment result, not supported distribution)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-performance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preflight
      - name: Install SQLite for independent fixture assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sqlite3 time
      - name: Test measurement and fixture contracts
        shell: pwsh
        run: |
          ./scripts/performance/Test-BenchmarkFixtures.ps1
          ./scripts/performance/Test-PublishCliBenchmark.ps1

  measure:
    needs: harness-tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1; #830 redirect sanitization
        with:
          global-json-file: global.json
      - name: Install measurement and optional AOT prerequisites
        shell: pwsh
        env:
          INCLUDE_AOT: ${{ inputs.include_aot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sqlite3 time
          if ($env:INCLUDE_AOT -eq 'true') {
              sudo apt-get install --yes --no-install-recommends clang zlib1g-dev
          }
      - name: Publish matching candidates and measure forward and reverse rounds
        shell: pwsh
        env:
          BENCHMARK_RID: ${{ matrix.rid }}
          BENCHMARK_ITERATIONS: ${{ github.event_name == 'pull_request' && 2 || inputs.iterations }}
          BENCHMARK_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cli-performance'
          $candidates = @('baseline', 'uncompressed', 'selective-extraction', 'ready-to-run')
          foreach ($candidate in $candidates) {
              ./scripts/performance/Publish-CliBenchmark.ps1 -RuntimeIdentifier $env:BENCHMARK_RID -Candidate $candidate -OutputDirectory "$root/$candidate"
          }
          foreach ($round in 1..2) {
              if ($round -eq 2) {
                  [array]::Reverse($candidates)
              }
              foreach ($candidate in $candidates) {
                  $arguments = @{
                      Executable = "$root/$candidate/publish/grate"
                      BuildManifest = "$root/$candidate/build.json"
                      OutputDirectory = "$root/$candidate/round-$round"
                      Iterations = [int]$env:BENCHMARK_ITERATIONS
                      ExecutionMode = 'native'
                  }
                  if ($env:BENCHMARK_EVENT -eq 'pull_request') {
                      $arguments.SmallScriptCount = 5
                      $arguments.LargeRowCount = 50
                  }
                  ./scripts/performance/Invoke-CliBenchmark.ps1 @arguments
              }
          }
      - name: Verify packaged candidates without an installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cli-performance'
          foreach ($candidate in @('baseline', 'uncompressed', 'selective-extraction', 'ready-to-run')) {
              ./scripts/performance/Test-CliWithoutRuntime.ps1 -Executable "$root/$candidate/publish/grate" -BuildManifest "$root/$candidate/build.json" -OutputDirectory "$root/$candidate/runtime-free"
          }
      - name: Investigate Native AOT without changing release settings
        if: ${{ inputs.include_aot }}
        shell: pwsh
        env:
          BENCHMARK_RID: ${{ matrix.rid }}
          BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cli-performance/native-aot'
          ./scripts/performance/Publish-CliBenchmark.ps1 -RuntimeIdentifier $env:BENCHMARK_RID -Candidate native-aot -OutputDirectory $root
          ./scripts/performance/Invoke-CliBenchmark.ps1 -Executable "$root/publish/grate" -BuildManifest "$root/build.json" -OutputDirectory "$root/measurements" -Iterations ([int]$env:BENCHMARK_ITERATIONS) -ExecutionMode native
      - name: Retain raw measurements, logs and artifact identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-performance-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/cli-performance
            !${{ runner.temp }}/cli-performance/**/publish/**
            !${{ runner.temp }}/cli-performance/**/publish.tar.gz
            !${{ runner.temp }}/cli-performance/**/extraction/**
          if-no-files-found: error
          retention-days: 30
