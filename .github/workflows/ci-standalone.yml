# Reusable standalone cli phase. Scheduling and aggregate gates live in ci.yml.
name: CI · Standalone CLI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  standalone:
    name: CLI ${{ matrix.distribution == 'All' && matrix.rid || format('{0} {1}', matrix.distribution, matrix.rid) }}
    timeout-minutes: 30
    env:
      # Publish and package the same fixture identity; MSI rejects mismatched payloads.
      STANDALONE_VERSION: '0.0.1'
    strategy:
      fail-fast: false
      matrix:
        distribution: [All, SQLite, SQLServer, MariaDB, PostgreSQL, Oracle]
        rid: [win-x64, win-x86, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
        include:
          - { rid: win-x64, os: windows-latest, smoke: true }
          - { rid: win-x86, os: windows-latest, smoke: true }
          - { rid: win-arm64, os: windows-11-arm, smoke: true }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, smoke: true }
          # musl execution is covered by native Alpine container checks below.
          - { rid: linux-musl-x64, os: ubuntu-latest, smoke: false }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, smoke: false }
          - { rid: osx-x64, os: macos-15-intel, smoke: true }
          - { rid: osx-arm64, os: macos-15, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify self-contained runtime and execution
        shell: pwsh
        env:
          RUN_SMOKE_TEST: ${{ matrix.smoke }}
        run: ./scripts/verify-packages.ps1 -Kind Standalone -Distribution '${{ matrix.distribution }}' -RuntimeIdentifier '${{ matrix.rid }}' -StandaloneVersion $env:STANDALONE_VERSION -OutputDirectory "${{ runner.temp }}/grate-cli" -RunSmokeTest:($env:RUN_SMOKE_TEST -eq 'true')
      - name: Check per-user MSI authoring regressions
        if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          ./installers/msi/tests/Test-InstallerAuthoring.Tests.ps1
          ./installers/msi/tests/Test-InstallerIdentity.Tests.ps1
          ./installers/msi/Test-InstallerLifecycle.Assertions.Tests.ps1
          ./installers/msi/Test-InstallerLifecycle.Process.Tests.ps1
          ./installers/msi/tests/support/Test-MsiLifecycleNativeProcess.Tests.ps1 -OutputDirectory "${{ runner.temp }}/msi-native-controls"
          ./installers/msi/tests/Test-MsiLifecycleOuterPipes.Tests.ps1 -OutputDirectory "${{ runner.temp }}/msi-outer-pipes"
          ./installers/msi/tests/Test-MsiLifecycleSupervisor.Tests.ps1
      - name: Build MSI from verified Windows binary
        if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          $identity = ./installers/msi/helpers/Get-InstallerIdentity.ps1 -Version $env:STANDALONE_VERSION -Distribution '${{ matrix.distribution }}' -Architecture ('${{ matrix.rid }}' -replace 'win-', '')
          "MSI_PACKAGE_ID=$($identity.PackageId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./installers/msi/Create-Installer.ps1 -grateExe "${{ runner.temp }}/grate-cli/published/grate.exe" -Version $env:STANDALONE_VERSION -Distribution '${{ matrix.distribution }}' -arch ('${{ matrix.rid }}' -replace 'win-', '')
      - name: Check verified Windows MSI metadata
        if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        shell: pwsh
        run: ./installers/msi/tests/Test-InstallerMetadata.Tests.ps1 -MsiPath "installers/msi/tmp/$env:MSI_PACKAGE_ID-$env:STANDALONE_VERSION.msi" -ExpectedVersion $env:STANDALONE_VERSION -Distribution '${{ matrix.distribution }}' -ExpectedArchitecture ('${{ matrix.rid }}' -replace 'win-', '')
      - name: Verify installed MSI, major upgrade and uninstall
        if: matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        # Leave room in the job for diagnostics if worker supervision stalls.
        timeout-minutes: 8
        shell: pwsh
        run: |
          $parameters = @{
            MsiPath = "./installers/msi/tmp/$env:MSI_PACKAGE_ID-$env:STANDALONE_VERSION.msi"
            PublishedExecutable = "${{ runner.temp }}/grate-cli/published/grate.exe"
            Architecture = '${{ matrix.rid }}' -replace 'win-', ''
            Distribution = '${{ matrix.distribution }}'
            OutputDirectory = "${{ runner.temp }}/grate-msi-lifecycle"
          }
          # Bound COM calls and inherited output handles as well as child processes.
          ./installers/msi/tests/support/Invoke-MsiLifecycle.ps1 `
            -ScriptPath ./installers/msi/Test-InstallerLifecycle.ps1 `
            -Parameters $parameters -TimeoutSeconds 360
      - name: Build Debian packages from verified Linux binary
        if: matrix.distribution == 'All' && (matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $architecture = '${{ matrix.rid }}' -replace 'linux-', '' -replace 'x64', 'amd64'
          foreach ($version in @('0.0.1', '0.0.2')) {
            ./installers/deb/Create-Package.ps1 -grateExe "${{ runner.temp }}/grate-cli/published/grate" -Version $version -arch $architecture
          }
      - name: Verify Debian installation, package upgrade and purge
        if: matrix.distribution == 'All' && (matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64')
        shell: pwsh
        run: |
          $architecture = '${{ matrix.rid }}' -replace 'linux-', '' -replace 'x64', 'amd64'
          ./installers/deb/Test-PackageLifecycle.ps1 `
            -InitialPackage "installers/deb/grate_0.0.1-1_${architecture}.deb" `
            -UpgradePackage "installers/deb/grate_0.0.2-1_${architecture}.deb" `
            -Architecture $architecture -InitialVersion '0.0.1-1' -UpgradeVersion '0.0.2-1' `
            -OutputDirectory "${{ runner.temp }}/grate-debian-lifecycle"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.distribution == 'All' && format('grate-package-{0}', matrix.rid) || format('grate-package-{0}-{1}', matrix.distribution, matrix.rid) }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/grate-cli/published/*
            ${{ runner.temp }}/grate-cli/*.json
            installers/msi/tmp/*.msi
            installers/deb/*.deb
            ${{ runner.temp }}/grate-msi-lifecycle/
            ${{ runner.temp }}/grate-msi-lifecycle-supervisor/
            ${{ runner.temp }}/msi-native-controls/
            ${{ runner.temp }}/msi-outer-pipes/
            ${{ runner.temp }}/lifecycle/
            ${{ runner.temp }}/grate-debian-lifecycle/
            !${{ runner.temp }}/grate-msi-lifecycle/upgrade-payload/
